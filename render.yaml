services:
  - type: web
    name: YOUTHT-CONNECT
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/anomassy/YOUTHT-CONNECT
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: youtht-connect-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: postgres
      - key: ADMIN_PASSWORD
        sync: true
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: youtht-connect-db
    databaseName: youth_connect
    user: youth_connect
    plan: free
    region: oregon
