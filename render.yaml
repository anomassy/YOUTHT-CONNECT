services:
  - type: web
    name: youtht-connect
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: youtht-connect-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: youtht-connect-db
    databaseName: youth_connect
    user: youth_connect
    plan: free
